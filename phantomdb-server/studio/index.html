<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>PhantomDB Studio</title>
	<style>
		* { box-sizing: border-box; }
		body {
			font-family: 'Segoe UI', system-ui, sans-serif;
			margin: 0;
			height: 100vh;
			background: #05050a;
			color: #e8ecf5;
		}

		/* ---- Login screen ---- */
		#login-screen {
			position: fixed; inset: 0;
			background: #05050a;
			display: flex; align-items: center; justify-content: center;
			z-index: 100;
		}
		#login-box {
			width: 340px;
			padding: 36px 32px;
			background: #0a0a12;
			border: 1px solid #1a1f2e;
			border-radius: 12px;
			text-align: center;
		}
		#login-logo {
			width: 56px; height: 56px;
			margin: 0 auto 18px auto;
			filter: drop-shadow(0 0 10px rgba(0, 180, 255, 0.55));
		}
		#login-logo img { width: 100%; height: 100%; object-fit: contain; }
		#login-box h1 {
			font-size: 15px; font-weight: 700; letter-spacing: 1.5px;
			color: #eef2fb; margin: 0 0 4px 0;
		}
		#login-box h1 span { color: #4fd8ff; }
		#login-box p { font-size: 12px; color: #5a6478; margin: 0 0 24px 0; }
		#login-box input {
			width: 100%; padding: 11px 13px; margin-bottom: 10px;
			background: #0d0f18; border: 1px solid #1e2536; border-radius: 7px;
			color: #e8ecf5; font-size: 13px;
		}
		#login-box input:focus { outline: none; border-color: #0aa3e8; }
		#login-box button {
			width: 100%; padding: 11px; margin-top: 8px;
			background: linear-gradient(135deg, #00d4ff, #0055ff);
			border: none; border-radius: 7px;
			color: #05050a; font-size: 13px; font-weight: 700;
			cursor: pointer;
		}
		#login-box button:hover { filter: brightness(1.08); }
		#login-error {
			color: #ff6b7a; font-size: 12px; margin-top: 12px; display: none;
		}
		#login-tagline {
			margin-top: 22px; padding-top: 16px; border-top: 1px solid #1a1f2e;
			font-size: 9.5px; letter-spacing: 1.5px; color: #3a4256;
		}

		/* ---- App ---- */
		#app { display: none; height: 100vh; }
		#app.visible { display: flex; }

		#sidebar {
			width: 240px;
			background: #08080f;
			border-right: 1px solid #1a1f2e;
			padding: 20px 16px;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
		}
		#brand {
			display: flex; align-items: center; gap: 10px;
			margin-bottom: 24px; padding-bottom: 16px;
			border-bottom: 1px solid #1a1f2e;
		}
		#brand-mark { width: 30px; height: 30px; filter: drop-shadow(0 0 6px rgba(0,180,255,0.5)); flex-shrink: 0; }
		#brand-mark img { width: 100%; height: 100%; object-fit: contain; }
		#brand-text { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
		#brand-text span { color: #4fd8ff; }
		#brand-text small { display: block; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: #5a6478; margin-top: 2px; }

		#sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #5a6478; margin: 0 0 12px 4px; }

		.collection {
			padding: 9px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
			font-size: 13px; color: #c4cbdb; border: 1px solid transparent; transition: all 0.15s;
		}
		.collection:hover { background: #12141f; border-color: #1e2536; }
		.collection.active {
			background: linear-gradient(90deg, rgba(0,180,255,0.12), transparent);
			border-color: #0088cc; color: #4fd8ff;
		}

		#sidebar-footer {
			margin-top: auto; padding-top: 16px; border-top: 1px solid #1a1f2e;
			font-size: 9px; letter-spacing: 1.5px; color: #3a4256; text-align: center;
		}

		#main { flex: 1; padding: 28px 32px; overflow: auto; }
		table { width: 100%; border-collapse: collapse; }
		th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #14182a; font-size: 13px; }
		th { color: #5a6478; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
		td { color: #c4cbdb; }
		tr:hover td { background: #0d1120; }
		td:first-child { color: #4fd8ff; font-family: 'Consolas', monospace; }
		#empty { color: #3a4256; padding: 60px; text-align: center; font-size: 14px; }
	</style>
</head>
<body>
	<div id="login-screen">
		<div id="login-box">
			<div id="login-logo"><img src="/studio/logo.png"></div>
			<h1>PHANTOM<span>DB</span> STUDIO</h1>
			<p>Sign in to browse your database</p>
			<form id="login-form">
				<input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
				<input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
				<button type="submit">Sign in</button>
				<div id="login-error">Invalid username or password</div>
			</form>
			<div id="login-tagline">BUILDING &bull; SECURING &bull; CONNECTING</div>
		</div>
	</div>

	<div id="app">
		<div id="sidebar">
			<div id="brand">
				<div id="brand-mark"><img src="/studio/logo.png"></div>
				<div id="brand-text">PHANTOM<span>DB</span><small>STUDIO</small></div>
			</div>
			<h2>Collections</h2>
			<div id="collection-list"></div>
			<div id="sidebar-footer">BUILDING &bull; SECURING &bull; CONNECTING</div>
		</div>
		<div id="main">
			<div id="empty">Select a collection to view its data</div>
			<table id="data-table" style="display:none">
				<thead><tr><th>Key</th><th>Value</th></tr></thead>
				<tbody id="data-body"></tbody>
			</table>
		</div>
	</div>

	<script src="/studio/studio.js"></script>
</body>
</html>
